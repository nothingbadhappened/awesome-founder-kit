name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Claude Code at the version compat.lock.json pins, for `claude plugin validate --strict`.
      - name: Install Claude Code (pinned)
        shell: bash
        run: npm i -g "@anthropic-ai/claude-code@$(node -p "require('./plugins/founder-kit/compat.lock.json').tools['claude-code'].version")"
      - name: Tests
        run: node --test "plugins/founder-kit/tests/*.test.mjs"
      - name: Validate marketplace and plugins (strict)
        shell: bash
        run: |
          claude plugin validate --strict .
          for d in plugins/*/; do claude plugin validate --strict "$d"; done
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # docs/ and .omc/ are working notes; the public repo never ships them.
      - name: No docs/ or .omc/ tracked
        run: |
          f=$(git ls-files docs .omc)
          if [ -n "$f" ]; then echo "tracked private paths:"; echo "$f"; exit 1; fi
      - name: gitleaks (pinned release, checksum verified)
        env:
          V: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP" && curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz"
          echo "$SHA256  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          "$RUNNER_TEMP/gitleaks" dir "$GITHUB_WORKSPACE" --redact --no-banner --exit-code 1
