# Fresh clone: proves the project runs on a machine that has never seen it, with only `just setup` and `just check`.
# Tool versions come from .mise.toml; just runs at the kit's pinned version (fk portability init writes it) even when
# .mise.toml does not list it yet. Services come from compose.yaml.
# Actions are pinned by commit; the comment names the release.
name: fresh-clone
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fresh-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: true
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.9.18
          install: true
      - name: Services (compose.yaml, if any)
        run: |
          if [ -f compose.yaml ]; then
            if command -v docker >/dev/null 2>&1; then docker compose up -d --wait; else podman compose up -d; fi
          fi
      - name: just setup
        run: mise exec just@1.58.0 -- just setup
      - name: just check
        run: mise exec just@1.58.0 -- just check
